# Diospada (AR, 2015): a Le Mans prototype shape whose signature is the rear
# — two tall buttresses rise from the back fenders and carry a long flat roof
# plate right over the rear wheels. Ahead of it two rounded fender crowns over
# the front wheels, headlights in their noses, either side of a low sunken
# centre nose, and an open carbon-rimmed cockpit.
