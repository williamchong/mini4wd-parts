# Dash-3 Shooting Star (MS, 2013 re-release of the 1988 car): a single-seater
# racer, very narrow between big slick tires. A long tapering nose, a dark
# elongated cockpit bubble on top, an air box behind the driver's head, side
# pods along the flanks, and a wing carried on twin tall rear fins.
