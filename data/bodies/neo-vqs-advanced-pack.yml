# Neo-VQS (VZ, 2021): a sharp Le Mans prototype that runs between its wheels.
# A long knife nose tapering to a point, canards either side of it, a smoked
# bubble canopy over the middle, and twin tail fins carrying a wide rear wing.
#
# This file is the Advanced Pack kit only; the shell is the same moulding as
# the plain Neo-VQS, which is authored elsewhere — merge the two.
name: Neo-VQS
reference: '95598'
titles: [Neo-VQS Advanced Pack]
# z, halfWidth, shoulder, halfDeck, deck[, halfTop, height]
hull:
  - [-58, 22, 10, 18, 14]
  - [-44, 25, 12, 21, 17]
  - [-30, 26, 12, 22, 18, 15, 25]
  - [-12, 26, 12, 22, 18, 16, 27]
  - [6, 25, 11, 21, 16, 14, 23]
  - [24, 23, 9, 19, 13]
  - [42, 20, 7, 16, 10]
  - [58, 14, 5, 11, 7]
  - [68, 8, 3, 6, 4]
pods:
