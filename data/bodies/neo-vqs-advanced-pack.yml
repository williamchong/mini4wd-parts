  - x: 24
    stations:
      - [-54, 3, 27, 14]
      - [-42, 3, 26, 14]
      - [-28, 2, 19, 14]
  # The nose canards.
  - x: 23
    stations:
      - [26, 7, 13, 7]
      - [40, 8, 14, 6]
      - [50, 6, 12, 6]
wing: { z: -54, halfWidth: 30, height: 29, chord: 12, pylons: 22 }
