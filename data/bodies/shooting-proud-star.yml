# Shooting Proud Star (MA, 2016): a narrow open-wheel racer. A long sharp nose
# between splitter fins, a long bronze bubble canopy running from just behind
# the nose back to the middle, twin angled fins standing at the rear corners,
# and a wide high wing over the tail. The wheels are fully exposed, so no
# arches and no fenders.
