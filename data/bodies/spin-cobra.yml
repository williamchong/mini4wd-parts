  # their noses.
  # z, halfWidth, top, bottom
  - x: 23
    stations:
      - [12, 6, 13, 6]
      - [26, 10, 18, 4]
      - [44, 11, 19, 3]
      - [58, 9, 15, 3]
      - [66, 5, 10, 4]
  # The twin fins standing at the rear corners.
