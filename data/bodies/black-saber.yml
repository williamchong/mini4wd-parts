# Black Saber (Super-II, the premium re-release): a Saber-family prototype,
# shorter and wider than Sonic Saber. Two rounded fender crowns over the front
# wheels carry the headlights either side of a low scooped centre nose; a long
# narrow gold canopy runs most of the roof, fenders are cut open over all four
# wheels, and a tall two-plate wing stands on twin pylons above a short tail.
