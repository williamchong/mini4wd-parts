# Hotshot Jr. (MS, 2012 re-release of the 1986 car): the classic buggy, narrow
# between big knobby tires. A flat low bonnet with round mirror pods on stalks,
# a small upright cab with a dark windscreen set back over the middle, an open
# engine bay behind it, and a big flat wing on posts over the tail.
name: Hotshot Jr.
reference: '18624'
titles: [Hotshot Jr.]
