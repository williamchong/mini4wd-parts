# Aero Manta Ray (AR, 2015): a narrow, raised body running between four exposed
# wheels. Pointed fins at the corners of the nose, a long blue canopy from the
# front axle to the middle with open side intakes behind it, flanks that sweep
# up at the rear quarters, and a curved wing on two close swan-neck pylons.
