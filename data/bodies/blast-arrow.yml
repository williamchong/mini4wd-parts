# Blast Arrow (MA, 2013): a Le Mans prototype. Two tall bullet pods over the
# front wheels, headlights in their noses, either side of a low flat splitter
# and a raised centre nose; a bubble canopy just ahead of the middle with a
# wide intake hoop behind it; rear fenders standing up over the wheels, cut
# open beneath; and a wide rear wing on two pylons at the tail.
