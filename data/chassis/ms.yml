# What the bare runner puts in each slot before the user changes anything
# (docs/PLAN.md §4.7). Most of it is molded into the kit and Tamiya sells no
# equivalent Grade-Up Part, so those entries carry a label and no item number:
# you already own them and you cannot buy them separately.
#
# The PRO motor is one of them. Tamiya sells the single-shaft FA-130 as AO-1001
# but has never catalogued the double-shaft normal motor a PRO kit ships, so
# there is no item number to name here.
defaultLoadout:
  motor:
    - label: { zh-HK: 原裝雙軸摩打, zh-TW: 原裝雙軸馬達, en: Kit standard double-shaft motor }
      source: chassis
