      source: chassis
  switch:
    - label: { zh-HK: 原裝電源開關, en: Kit standard switch }
      source: chassis
  axle:
    - label: { zh-HK: 原裝車軸, en: Kit standard axles }
      source: chassis
  bearing:
    - label: { zh-HK: 原裝塑膠軸套, en: Kit standard plastic bushings }
      source: chassis
  wheel-front:
    - label: { zh-HK: 原裝輪圈, en: Kit standard wheels }
