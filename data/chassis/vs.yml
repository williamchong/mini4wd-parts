# What the bare runner puts in each slot before the user changes anything
# (docs/PLAN.md §4.7). Most of it is molded into the kit and Tamiya sells no
# equivalent Grade-Up Part, so those entries carry a label and no item number:
# you already own them and you cannot buy them separately.
defaultLoadout:
