# Hand-authored corrections layered on top of the generated kit records.
#
# scripts/catalog/generate.ts deep-merges each entry into the derived record,
# exactly as data/overrides/parts.yml does for parts. Nothing in content/kits is
# ever edited by hand — a re-scrape rewrites it from scratch.
#
# The usual reason to add an entry here is to turn a loadout label into a real
# catalog part. The Fandom wiki describes what a box contains in free text
# ("Small Low-Profile Fin-Type"), and most of those moulded parts have no Tamiya
# item number at all. Where one genuinely does, name it:
#
#   '18717':
#     stockLoadout:
#       wheel-front: [{ partId: '15120', source: override }]
#       wheel-rear:  [{ partId: '15120', source: override }]
#
# `npm run catalog:verify` rejects a partId that is not in the catalog or does
# not fit that slot, so a wrong guess fails the build rather than shipping.
#
# `npm run catalog:report` lists the kits still relying on labels alone.

# --- Motors -----------------------------------------------------------------
#
# Every motor the wiki names is a real Grade-Up Part, so all fifteen resolve to
# an item number rather than staying free text. That buys three things a label
# could not: the builder can link the motor, it localises through the part's own
# names instead of a translation we authored, and it reaches the shopping list
# as something you can actually buy.
#
# The PRO suffix is load-bearing — 15487 is double-shaft and 15484 single — and
# the wiki gets it right on all fifteen: every PRO label sits on an MA kit and
# every bare one on a single-shaft chassis. `catalog:verify` checks the part
# fits the slot but not that the shaft fits the chassis, so this pairing was
# checked by hand against each kit's chassis (docs/PLAN.md §4.8).

'18647': { stockLoadout: { motor: [{ partId: '15487', source: override }] } }  # MA   Torque-Tuned 2 PRO
'18706': { stockLoadout: { motor: [{ partId: '15485', source: override }] } }  # AR   Rev-Tuned 2
