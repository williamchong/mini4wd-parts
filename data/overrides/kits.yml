# --- Bundle packs -----------------------------------------------------------
#
# The five boxes that hold a car *and* the tune-up parts to race it: three
# ミニ四駆スターターパック and two アドバンスパック. The wiki's Technical Info List
# describes the car and nothing else, so no plate, brake or mass damper in the
# box reaches the builder unless it is named here — and those are what the box
# is bought for.
#
# The contents are Tamiya's own product copy on the item page (18706: レブチューン2
# モーターをはじめ、スーパーハードタイヤ(ブラック)、ブレーキセット、サイドマスダンパー
# セット、FRPプレート(フロント･リヤ)); the wiki's prose says which product each of
# those names is. Three things the two sources agree are in the box are still
# left out, so their absence is not read as an oversight:
#
#   * the black super-hard low-profile tires, which Tamiya sells only inside a
#     wheel-and-tire set, so there is no item number for the tires alone — those
#     rows keep the kit's own label;
#   * the aluminium spacers, roller stoppers, nuts and washers, which go wherever
#     a setup puts them, so the pane has no place to draw them (PLAN.md §5.6);
#   * 18647's フロントアンダーガード (15405), which bolts to the same front bumper as
#     its FRP plate, and `front-stay` holds one part.
#
# The starter packs' stabiliser balls are in. Tamiya sells them in no bag of their
# own — the wiki files them under the ボールスタビキャップ article, but no product
# copy names 15385 or 15386 — so each is a label that names its own `DAMPERS`
# row where a part's record would, moulded in the kit's `colours.damper`. A row is a mirrored pair at one
# end's outer roller, the rear first: two rows are the four balls the MA and
# FM-A boxes hold. The AR box holds six, and the pane has a corner at each end
# and nowhere for a third pair, so it draws four of them.
#
# The three starter packs share their plates and brake: 15451, 15452 and 15458
# are sold for the AR chassis and Tamiya lists all three as fitting MA and FM-A
# too, which is why the same numbers sit on a Blast Arrow and a Rowdy Bull.

# Starter packs. Each is a car, a tuned motor, the same two FRP plates and
# brake set, and one mass damper of its own.
'18647':  # スターターパックMA パワータイプ (ブラストアロー)
  stockLoadout:
    motor: [{ partId: '15487', source: override }]            # トルクチューン2モーターPRO
    front-stay: [{ partId: '15451', source: override }]       # ARシャーシ FRPフロントワイドステー
    rear-stay: [{ partId: '15452', source: override }]        # ARシャーシ FRPリヤワイドステー
    brake: [{ partId: '15458', source: override }]            # ARシャーシ ブレーキセット
    # Tamiya says マスダンパー; the wiki counts two cylinder weights, which is
    # what 15392 is — two 4.7g weights and the long screws to hang them on.
    damper:
      - { partId: '15392', source: override }                 # マスダンパーセット
      - { label: { ja: ボールスタビキャップ, en: Stabiliser balls, zh-HK: 防傾圓球 }, shape: ball-cap, source: override }
      - { label: { ja: ボールスタビキャップ, en: Stabiliser balls, zh-HK: 防傾圓球 }, shape: ball-cap, source: override }
  colours: { damper: '#d0312d' }                                # red balls
'18706':  # スターターパックAR スピードタイプ (エアロ アバンテ)
  stockLoadout:
    motor: [{ partId: '15485', source: override }]            # レブチューン2モーター
    front-stay: [{ partId: '15451', source: override }]
    rear-stay: [{ partId: '15452', source: override }]
    brake: [{ partId: '15458', source: override }]
    # The same set fills two rows: its four weights and the two FRP side plates
    # they hang from, both on the car in Tamiya's photo of this box.
    damper:
      - { partId: '15459', source: override }                 # ARシャーシ サイドマスダンパーセット
      - { label: { ja: ボールスタビキャップ, en: Stabiliser balls, zh-HK: 防傾圓球 }, shape: ball-cap, source: override }
      - { label: { ja: ボールスタビキャップ, en: Stabiliser balls, zh-HK: 防傾圓球 }, shape: ball-cap, source: override }
    side-stay: [{ partId: '15459', source: override }]
  colours: { damper: '#3d63d8' }                                # blue balls
'18710':  # スターターパックFM-A バランスタイプ (ラウディーブル)
  stockLoadout:
    motor: [{ partId: '15486', source: override }]            # アトミックチューン2モーター
    front-stay: [{ partId: '15451', source: override }]
    rear-stay: [{ partId: '15452', source: override }]
    brake: [{ partId: '15458', source: override }]
    # Tamiya names マスダンパースクエアショート and the wiki measures the blocks at
    # 6×6×14mm, which is 15515 — first sold on its own in 2023, six years after
    # this box, but the same part and the only way to buy one.
    damper:
      # Bare blocks, so the box's own photo is what says where they went:
      # one each side on the guards, not a pair across an end.
      - { partId: '15515', mount: side, source: override }   # マスダンパー スクエア ショート (6x6x14mm)
      - { label: { ja: ボールスタビキャップ, en: Stabiliser balls, zh-HK: 防傾圓球 }, shape: ball-cap, source: override }
      - { label: { ja: ボールスタビキャップ, en: Stabiliser balls, zh-HK: 防傾圓球 }, shape: ball-cap, source: override }
  colours: { damper: '#1f2124' }                                # black balls

# Advanced packs. No brake set in either; both go deeper into the drivetrain
# than a starter pack does.
'18662':  # アバンテMk.III ネロ アドバンスパック (MSシャーシ)
  # No wiki article reaches this box, so its parts are Tamiya's own sentence:
  # ライトダッシュモーターPRO、FRP製の前後ワイドステー、ハイスピードEXギヤ、マスダンパー.
  # It is also the one motor here the wiki does not name, so the PRO pairing the
  # Motors section relies on was checked by hand: 15402 is double-shaft, MS takes
  # a double-shaft motor. The brake sponge under the front plate in the product
  # photo is not in that sentence, so no brake row is claimed for it.
  stockLoadout:
    motor: [{ partId: '15402', source: override }]            # ライトダッシュモーターPRO
    gear-set: [{ partId: '15429', source: override }]         # MSシャーシ用ハイスピードEXギヤセット(3.7:1)
    front-stay: [{ partId: '15451', source: override }]
    rear-stay: [{ partId: '15452', source: override }]
    damper: [{ partId: '15392', source: override }]
  # No wiki row, so no A-parts colour for the rollers to fall back to.
  colours: { body: '#1f2124', wheel: '#d0312d', tire: '#1f2124', roller: '#d0312d' }
'95598':  # ネオVQS アドバンスパック (VZシャーシ)
  stockLoadout:
    motor: [{ partId: '15455', source: override }]            # ライトダッシュモーター
    gear-set: [{ partId: '15462', source: override }]         # カーボン強化ギヤ G13・8Tピニオンセット
    counter-gear: [{ partId: '15434', source: override }]     # ハイスピードEXカウンターギヤセット(3.7:1)
    propeller-shaft: [{ partId: '15205', source: override }]  # 1.4mm中空軽量プロペラシャフト
    front-stay: [{ partId: '15451', source: override }]
    rear-stay: [{ partId: '15518', source: override }]        # FRPリヤブレーキステーセット
    # The wiki calls this box's weights the AR side mass damper set, and the
    # photo says otherwise: they are rounded blocks bolted to the VZ's own side
    # stays, not that set's bowl and cylinder weights on its FRP side plates,
    # which are nowhere on the car. Tamiya's own copy says only マスダンパー, so
    # the row says that and names no item number.
    damper:
      - label: { ja: マスダンパー, en: Mass damper, zh-HK: 制震器 }
        source: override
  # Its A parts are clear yellow; the six 13mm rollers in the box are black.
  colours: { roller: '#1f2124' }

