# Hand-authored corrections layered on top of the scraped catalog.
#
# scripts/catalog/generate.ts deep-merges each entry into the derived record and
# marks the touched fields as `source: override`. Nothing in content/ is ever
# edited by hand — corrections belong here, so a re-scrape cannot undo them.
#
# Motors are the standing exception to derived legality: Tamiya's rules name
# specific motors rather than a category (docs/research/concepts-and-rules.md
# §1.1, §3), so every motor needs an explicit entry.
#
#   Junior / Family / Trial : Tune series only
#   Stock Class / B-MAX GP  : Tune + Dash series
#   Open                    : Tune + Dash, except Ultra-Dash and Plasma-Dash
#
# Specs (RPM, torque) are parsed from Tamiya's own 【基本スペック】 block and are
# deliberately not repeated here.

