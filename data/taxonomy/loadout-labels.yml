# Traditional Chinese for the wheel and tire phrases imported from the Fandom
# wiki — docs/PLAN.md §4.8.
#
# Keyed by the phrase as `normaliseLabel` (scripts/catalog/labels.ts) leaves it,
# not as the wiki wrote it: the wiki spells one wheel several ways, and keying
# on the raw text would translate the same wheel twice and let the two drift.
# Run `npm run catalog:report` for the phrases still missing an entry — those
# render in English, marked as a fallback, rather than disappearing.
#
# `en` is never authored here. It is the normalised wiki phrase itself, which is
# both what an English reader should see and the key a reviewer looks up.
#
# TERMINOLOGY, and it is a judgement call rather than a citation: Tamiya HK
# publishes no Traditional Chinese for wheel and tire *types*, so unlike part
# names (which come from tamiya.hk) these are ours. Hong Kong and Taiwan agree
# on most of this vocabulary — 小徑, 大徑, 低框, 光頭胎 — so most rows carry only
# `zh-HK` and the Taiwan reader falls through to it, exactly as `resolveLabel`
# does for part names. A `zh-TW` appears only where the two genuinely differ.

# Spellings no mechanical rule reaches: a truncation, a redundant plural, and
# word order the wiki inverts. Left of the arrow is post-normalisation text.
aliases:
  # The wiki drops the final "e" on one article.
  Small Low-Profile Saber-Typ: Small Low-Profile Saber-Type
  # Profile and type swapped round.
  Small Saber-Type Low-Profile: Small Low-Profile Saber-Type
  Small Fin-Type Low-Profile: Small Low-Profile Fin-Type
  Small X-Type Narrow: Small X Narrow-Type
  # The slot already says these are tires.
  Small Low-Profile Tires: Small Low-Profile

