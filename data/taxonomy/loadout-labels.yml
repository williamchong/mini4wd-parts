  # — Motors ————————————————————————————————————————————————————————
  # Every motor phrase the wiki uses is a real Grade-Up Part, so all fifteen
  # entries are resolved to an item number in data/overrides/kits.yml and none
  # of these should ever render. They are kept as the safety net for a re-scrape
  # that turns up a motor no override covers yet — the raw snapshot already
  # holds `Atomic-Tuned 2 Motor` and `Torque-Tuned 2 Motor` on kits outside our
  # chassis scope, which `normaliseLabel` folds onto these keys by dropping the
  # trailing "Motor".
  Atomic-Tuned 2:
    zh-HK: Atomic-Tuned 2 摩打
    zh-TW: Atomic-Tuned 2 馬達
  Rev-Tuned 2:
