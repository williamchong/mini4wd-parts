# Category derivation rules for scripts/catalog/taxonomy.ts.
#
# Tamiya labels almost every Grade-Up Part "ミニ四駆グレードアップパーツ", so our
# taxonomy has to come from the product name. Rules are ordered and the FIRST
# match wins, which is what resolves the ambiguous names: "HG カーボンリヤワイド
# プレート (スライドダンパー対応)" is a plate, not a slide damper, because the
# plate rule sits above it.
#
# `match` entries are plain substrings tested against the NFKC-normalised
# Japanese name, then the English name. Anything that still lands wrong belongs
# in data/overrides/parts.yml, not in a more baroque rule here.
#
# `addOn` is a second question, asked only of a part the rule has already
# claimed: is this the thing its slot is named for, or something that goes with
# it? A roller O-ring is filed with the rollers and fills a roller slot, but a
# reader who opens the roller picker is looking for rollers, so the picker lists
# add-ons after the rest (shared/catalog/build.ts). The pattern is scoped to its
# own rule on purpose: ローラー用 means "for rollers" on an O-ring and on two
# FRP plates alike, and only the O-ring is a roller's add-on.

- category: setting-tool
  carPart: false
  match: [セッティングボード, セッティングゲージ, セッティング治具, ゲージ, チェックボックス]

- category: tool
  carPart: false
  match: [ドライバー, ピンバイス, ニッパー, ヤスリ, やすり, ペンチ, プライヤー, プーラー, リューター, クラフトツール, ドリル, ハンダ, チェッカー]

# シール is a substring of シールド (shield) and シールタイプ (sealed), so a bare
# match filed モータークーリングシールド and a 透明シールタイプ bearing set as
# stickers. Anchor it to the standalone word. Caught by `npm run catalog:crossref`
# against the Fandom wiki's curated part types.
- category: sticker
  carPart: false
  match: [ステッカー, デカール]
  regex: シール(?!ド|タイプ)

- category: accessory
  carPart: false
  match: [ケース, バッグ, ポーチ, マット, グリス, オイル, 塗料, マーカー, タオル, ストラップ, クリーナー,
          テープ, ボックス, クリヤーカバー, サーキット, ピット, キャッチャー, メンテナンスベース, スリーブ]

- category: bundle
  match: [ファーストトライパーツセット, スターターパック, ベーシックパーツセット, パーツセット]

# Tamiya writes these as "大径ナローライトウェイトホイール&ハードバレルタイヤ" —
# the two words are separated by the variant name, so a substring will not do.
- category: wheel-tire-set
  regex: (ホイール.*タイヤ|タイヤ.*ホイール)

- category: tire
  match: [タイヤ]

- category: wheel
  match: [ホイール]

- category: gear-cover
  match: [ギヤカバー, ギアカバー]

# A gear set is what the slot is for. Single AO gears (G-13, G-22), pinions,
# gear shafts and gear bearings are spares that rebuild or re-ratio one.
- category: gear
  match: [ギヤ, ギア, ピニオン, クラウン]
  addOn: \bG-?\d|ピニオン|ギヤシャフト|ギヤベアリング

- category: motor-mount
  match: [モーターマウント, モーターサポート]

- category: motor
  match: [モーター]


- category: terminal
  match: [ターミナル]

- category: switch
  match: [スイッチ]

- category: battery-holder
  match: [電池ホルダー, バッテリーホルダー]

- category: battery
  match: [ネオチャンプ, パワーチャンプ, 充電器, 電池, バッテリー]

- category: body-catch
  match: [ボディキャッチ, ボディーキャッチ]

- category: chassis-set
  match: [強化ユニット, センターシャーシ]
  regex: シャーシ\s*(セット|キット|強化)

- category: body
  match: [ボディ, キャノピー, ポリカ]

# Above `plate`: a ball-link mass damper sold with its carbon plate
# (ボールリンクマスダンパー（スクエア/カーボンプレート）) is a mass damper.
- category: mass-damper
  match: [マスダンパー, ウエイト, ウェイト, バランサー]

# ステー is a substring of ステーション, and every Mini 4WD Station limited
# edition carries that word, so a bare match filed a 19 mm roller and a tube
# stabilizer as plates — the シール/シールド failure above, in a new place.
- category: plate
  match: [プレート, ブレース, 補強]
  regex: ステー(?!ション)

# O-rings, pipes, spacers and bearings "for rollers" (ローラー用), and the
# mount that moves one outward. "With rubber rings" (ゴムリング付) is a roller.
- category: roller
  match: [ローラー]
  addOn: ローラー用|マウント

- category: bearing
  match: [ベアリング, ハトメ, はとめ, 軸受け]

- category: brake
  match: [ブレーキ]

- category: slide-damper
  match: [スライドダンパー]
  addOn: スプリング

- category: stabilizer
  match: [スタビ]
  addOn: キャップ

- category: bumper
  match: [バンパー, ステアリング, アンダーガード]


# Must sit above `shaft`: プロペラシャフト contains シャフト, but a propeller shaft
# drives the axles and an axle carries the wheels — different slots entirely, and
# PRO chassis have no propeller shaft at all.
- category: propeller-shaft
  match: [プロペラシャフト]

- category: shaft
  match: [シャフト]

- category: spacer
  match: [スペーサー, カラー, 六角マウント, Oリング]

- category: screw
  match: [ビス, ナット, ワッシャー, スプリング, ロックナット, スクリュー]
